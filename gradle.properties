# Project-wide Gradle settings

# Gradle daemon and build optimization
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX migration
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Android build optimizations
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# Enable native build
android.native.buildOutput=verbose

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.js=true

# CMake build settings
android.injected.build.abi=arm64-v8a,armeabi-v7a

# OpenCV Android SDK path (update this or set as environment variable)
# OPENCV_ANDROID_SDK=/path/to/opencv-android-sdk
# Or set via environment: export OPENCV_ANDROID_SDK=/path/to/opencv-android-sdk
